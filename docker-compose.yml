version: "3.8"

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt protocol (driver connections)
    environment:
      - NEO4J_AUTH=neo4j/graphrag_dev_pw   # CHANGE before any non-local use
      - NEO4J_PLUGINS=["apoc"]             # APOC needed for graph algorithms / bulk ops
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "graphrag_dev_pw", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  neo4j_import:
  neo4j_plugins:
